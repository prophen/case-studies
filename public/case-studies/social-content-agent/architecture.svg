<text x="55" y="118" font-size="22" font-weight="bold">Next.js interface</text><text x="55" y="151" font-size="17">Generate · edit · approve</text><text x="55" y="178" font-size="17">Schedule · view activity</text>
<text x="385" y="118" font-size="22" font-weight="bold">Authenticated routes</text><text x="385" y="151" font-size="17">Drafts + brand voice</text><text x="385" y="178" font-size="17">Generation + usage check</text>
<text x="755" y="118" font-size="22" font-weight="bold">OpenAI</text><text x="755" y="151" font-size="17">Responses API</text><text x="755" y="178" font-size="17">Returns draft text</text>
<text x="385" y="350" font-size="22" font-weight="bold">Supabase</text><text x="385" y="382" font-size="17">Auth + Postgres</text><text x="385" y="409" font-size="17">Drafts · events · preferences</text>
<text x="755" y="350" font-size="20" font-weight="bold">Protected cron route</text><text x="755" y="382" font-size="17">Processes due drafts</text><text x="755" y="409" font-size="17">Records publication events</text>
